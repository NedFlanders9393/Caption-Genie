kind = "mobile"
previewPath = "/captionai-mobile/"
title = "CaptionAI Mobile"
version = "1.0.0"
id = "artifacts/captionai-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/captionai-mobile/" ]
localPort = 19446

[services.development]
run = "pnpm --filter @workspace/captionai-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/captionai-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/captionai-mobile", "run", "serve" ]

[services.env]
PORT = "19446"
BASE_PATH = "/captionai-mobile/"
