<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open CaptionAI on your phone</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #FAFAFA;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 380px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #19141F;
      margin: 0 0 8px;
    }
    p {
      font-size: 15px;
      color: #6B7280;
      margin: 0 0 28px;
      line-height: 1.5;
    }
    .qr {
      width: 240px;
      height: 240px;
      border-radius: 12px;
      border: 1px solid #E5E7EB;
    }
    .step {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      text-align: left;
      margin-top: 28px;
    }
    .num {
      width: 28px;
      height: 28px;
      background: #7C3AED;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .step-text {
      font-size: 14px;
      color: #374151;
      line-height: 1.5;
      padding-top: 4px;
    }
    strong { color: #19141F; }
  </style>
</head>
<body>
  <div class="card">
    <h1>✦ Open on your iPhone</h1>
    <p>Scan this with your iPhone Camera app</p>
    <img
      class="qr"
      src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=exp%3A%2F%2F1c406915-0296-4f8a-ad96-20a0d87054f9-00-1ai52h6ncywag.expo.kirk.replit.dev&bgcolor=ffffff&color=19141F&margin=10"
      alt="QR Code"
    />
    <div class="step">
      <div class="num">1</div>
      <div class="step-text">Make sure <strong>Expo Go</strong> is installed on your iPhone</div>
    </div>
    <div class="step">
      <div class="num">2</div>
      <div class="step-text">Open your iPhone <strong>Camera app</strong> and point it at the QR code above</div>
    </div>
    <div class="step">
      <div class="num">3</div>
      <div class="step-text">Tap the notification that appears — CaptionAI will open in Expo Go</div>
    </div>
  </div>
</body>
</html>
