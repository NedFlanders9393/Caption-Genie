kind = "video"
previewPath = "/captly-promo-brand/"
title = "Captly Feature Reel"
version = "1.0.0"
id = "artifacts/captly-promo-brand"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/captly-promo-brand/" ]
localPort = 20676

[services.development]
run = "pnpm --filter @workspace/captly-promo-brand run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/captly-promo-brand", "run", "build" ]
publicDir = "artifacts/captly-promo-brand/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20676"
BASE_PATH = "/captly-promo-brand/"
