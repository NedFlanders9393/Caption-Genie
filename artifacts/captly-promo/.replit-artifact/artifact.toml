kind = "video"
previewPath = "/captly-promo/"
title = "Captly TikTok Promo"
version = "1.0.0"
id = "artifacts/captly-promo"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/captly-promo/" ]
localPort = 23155

[services.development]
run = "pnpm --filter @workspace/captly-promo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/captly-promo", "run", "build" ]
publicDir = "artifacts/captly-promo/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23155"
BASE_PATH = "/captly-promo/"
