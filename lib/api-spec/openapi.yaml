openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: captions
    description: Caption generation operations
  - name: checkins
    description: Daily check-in streak rewards
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /captions/generate:
    post:
      operationId: generateCaptions
      tags: [captions]
      summary: Generate social media captions using AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateCaptionsBody"
      responses:
        "200":
          description: Generated captions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateCaptionsResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /captions/regenerate-one:
    post:
      operationId: regenerateOneCaption
      tags: [captions]
      summary: Regenerate a single caption
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegenerateOneCaptionBody"
      responses:
        "200":
          description: Regenerated caption
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptionItem"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /captions/hashtags:
    post:
      operationId: generateHashtags
      tags: [captions]
      summary: Generate trending hashtags for a niche and topic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateHashtagsBody"
      responses:
        "200":
          description: Generated hashtags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateHashtagsResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /checkins/status:
    get:
      operationId: getCheckinStatus
      tags: [checkins]
      summary: Get daily check-in streak status and calendar
      responses:
        "200":
          description: Check-in status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckinStatus"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /checkins/claim:
    post:
      operationId: claimDailyCheckin
      tags: [checkins]
      summary: Claim today's daily check-in credit reward
      responses:
        "200":
          description: Reward claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckinClaimResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already claimed today
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    CheckinStatus:
      type: object
      properties:
        todayUtc:
          type: string
          description: Current UTC date ("YYYY-MM-DD") — the server's day boundary
        claimedToday:
          type: boolean
        nextStreakDay:
          type: integer
          description: 1-7 streak position the next claim lands on
        nextReward:
          type: integer
          description: Credits the next claim grants
        currentStreak:
          type: integer
          description: Consecutive-day streak as of the latest claim (0 if broken)
        rewards:
          type: array
          items:
            type: integer
          description: Reward schedule for the 7-day cycle
        claimedDatesThisMonth:
          type: array
          items:
            type: string
          description: Claimed UTC dates in the current month ("YYYY-MM-DD")
      required:
        - todayUtc
        - claimedToday
        - nextStreakDay
        - nextReward
        - currentStreak
        - rewards
        - claimedDatesThisMonth
    CheckinClaimResponse:
      type: object
      properties:
        granted:
          type: integer
        streakDay:
          type: integer
        balanceAfter:
          type: integer
        status:
          $ref: "#/components/schemas/CheckinStatus"
      required:
        - granted
        - streakDay
        - status
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    GenerateCaptionsBody:
      type: object
      properties:
        mode:
          type: string
          enum:
            - business
            - personal
          description: business = industry/brand captions (default); personal = everyday captions for people without a brand
        niche:
          type: string
        postDescription:
          type: string
        tone:
          type: string
          description: One or more tones, comma-separated (e.g. "Professional" or "Casual, Witty")
        platform:
          type: string
        postType:
          type: string
        captionLength:
          type: string
        includeEmojis:
          type: boolean
        ctaType:
          type: string
        keywords:
          type: string
          description: Comma-separated words/phrases the user wants woven into every caption
        occasion:
          type: string
          description: Personal-mode occasion preset (e.g. Birthday, Vacation/Travel) that shapes the caption's structure and vibe
      required:
        - postDescription
        - tone
    CaptionItem:
      type: object
      properties:
        caption:
          type: string
        hashtags:
          type: string
      required:
        - caption
        - hashtags
    GenerateCaptionsResponse:
      type: object
      properties:
        captions:
          type: array
          items:
            $ref: "#/components/schemas/CaptionItem"
      required:
        - captions
    RegenerateOneCaptionBody:
      type: object
      properties:
        mode:
          type: string
          enum:
            - business
            - personal
          description: business = industry/brand captions (default); personal = everyday captions for people without a brand
        niche:
          type: string
        postDescription:
          type: string
        tone:
          type: string
        platform:
          type: string
        postType:
          type: string
        captionLength:
          type: string
        includeEmojis:
          type: boolean
        ctaType:
          type: string
        keywords:
          type: string
          description: Comma-separated words/phrases the user wants woven into every caption
        occasion:
          type: string
          description: Personal-mode occasion preset (e.g. Birthday, Vacation/Travel) that shapes the caption's structure and vibe
        existingCaptions:
          type: array
          items:
            type: string
          description: Captions already shown so the new one is different
      required:
        - postDescription
        - tone
    GenerateHashtagsBody:
      type: object
      properties:
        niche:
          type: string
        topic:
          type: string
        platform:
          type: string
      required:
        - niche
        - topic
    GenerateHashtagsResponse:
      type: object
      properties:
        hashtags:
          type: array
          items:
            type: string
        grouped:
          type: object
          properties:
            niche:
              type: array
              items:
                type: string
            popular:
              type: array
              items:
                type: string
            broad:
              type: array
              items:
                type: string
          required:
            - niche
            - popular
            - broad
      required:
        - hashtags
        - grouped
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
